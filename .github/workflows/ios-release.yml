# Build, sign and upload the iOS app to App Store Connect (TestFlight).
# Run it by hand: Actions → "iOS release (TestFlight)" → Run workflow.
# Needs four repository secrets — see SETUP-IOS.md:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
name: iOS release (TestFlight)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the App Store (e.g. 1.0, 1.1)'
        required: true
        default: '1.0'

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check the Apple secrets are set
        run: |
          missing=""
          for v in TEAM KEY_ID ISSUER; do [ -z "${!v}" ] && missing="$missing $v"; done
          [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ] && missing="$missing ASC_KEY_P8_BASE64"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing — see SETUP-IOS.md"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: npm ci
      - run: npm test
      - name: Build the app (App Store version — no self-test)
        run: |
          npm run build
          npx cap sync ios
      - name: Apple key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
      - name: Archive (signed automatically with your team)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive | tail -25
      - name: Upload to App Store Connect (TestFlight)
        run: |
          sed "s/TEAM_ID/$TEAM/" ios/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -25
          echo "✅ Uploaded version ${{ inputs.version }} (build ${{ github.run_number }}). It appears in TestFlight after Apple's processing (10–30 min)."
      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
