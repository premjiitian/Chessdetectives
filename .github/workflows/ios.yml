# The iOS app: build it on a Mac, run it on an iPhone and an iPad simulator,
# let the app's self-test drive it (Stockfish, voice, storage, chess.com,
# puzzles, repertoire, chapters), and keep screenshots of every screen.
name: iOS app

on:
  push:
    paths: ['src/**', 'public/**', 'ios/**', 'capacitor.config.ts', 'package*.json', 'scripts/ios-sim-test.sh', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: npm ci
      - name: Build the web app with the self-test switched on
        run: |
          npm run engine
          npx tsc --noEmit
          # The chess.com account the self-test (and the screenshots) use: repository
          # variable DEMO_CHESS_USER (Settings → Secrets and variables → Actions → Variables).
          VITE_SELFTEST=1 VITE_SELFTEST_USER="${{ vars.DEMO_CHESS_USER || 'erik' }}" npx vite build
          npx cap sync ios
      - name: Build the app for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -25
      - name: iPhone — run the app and its self-test
        run: bash scripts/ios-sim-test.sh '^iPhone 1[0-9] Pro Max$|^iPhone 1[0-9] Pro$' build/Build/Products/Debug-iphonesimulator/App.app out/iphone
      - name: iPad — run the app and its self-test
        if: always()
        run: bash scripts/ios-sim-test.sh '^iPad Pro 13|^iPad Pro \(12.9|^iPad Air 13|^iPad Pro' build/Build/Products/Debug-iphonesimulator/App.app out/ipad
      - name: Release build compiles for real devices (unsigned)
        if: always()
        run: |
          npm run build
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-release CODE_SIGNING_ALLOWED=NO build | tail -15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screens
          path: out/
